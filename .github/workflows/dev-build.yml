# .github/workflows/dev-build.yml
name: QuarchPy Development Build and Release

on:
  push:
    branches:
      - 'Development'
      - '879-improve-quarchpy-snapshot'
  workflow_dispatch:

jobs:
  build-and-release-dev:
    name: Build and Create Development Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download and Unzip QPS Dependency
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_QPS }}
        run: |
          # This is the path inside your 'quarchpy' package
          TARGET_DIR="quarchpy/connection_specific/QPS"
          
          echo "Creating target and temp directories..."
          mkdir -p $TARGET_DIR
          mkdir -p temp_qps_download
          mkdir -p temp_qps_unzip

          echo "Downloading QPS release asset (*.zip) from developmental tag..."
          gh release download developmental \
            --repo QuarchTechnologyLtd/QPS \
            --pattern "*.zip" \
            --dir temp_qps_download
          
          echo "Unzipping files..."
          unzip -q temp_qps_download/*.zip -d temp_qps_unzip
          
          echo "Moving contents to target directory..."
          shopt -s dotglob
          mv temp_qps_unzip/*/* $TARGET_DIR/
          
          echo "Cleaning up..."
          rm -r temp_qps_download
          rm -r temp_qps_unzip
          echo "QPS files are now in $TARGET_DIR"

      - name: Verify QPS Download
        run: |
          echo "Verifying contents of 'quarchpy/connection_specific/QPS':"
          ls -lR quarchpy/connection_specific/QPS

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache-dependency-path: '.github/workflows/requirements-dev.txt'
          cache: 'pip'

      - name: Clean pycache and .pyc files
        run: |
          find . -type d -name "__pycache__" -exec rm -r {} +
          find . -type f -name "*.pyc" -delete

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements-dev.txt
          pip install -r .github/workflows/requirements-build.txt

      - name: Test with pytest and coverage
        run: |
          coverage run -m pytest
          coverage report

      - name: Get project version from file
        id: get_version
        run: |
          VERSION_STRING=$(python -c "import re; f=open('quarchpy/_version.py').read(); print(re.search(r'__version__\s*=\s*[\'\"]([^\'\"]+)[\'\"]', f).group(1))")
          echo "version=$VERSION_STRING" >> $GITHUB_OUTPUT

      - name: Check if version is a dev release
        id: version_check
        run: |
          VERSION_STRING="${{ steps.get_version.outputs.version }}"
          IS_DEV=$(python -c "from packaging.version import Version; print(str(Version('$VERSION_STRING').is_devrelease).lower())")
          echo "is_dev_release=$IS_DEV" >> $GITHUB_OUTPUT
          echo "Version found: $VERSION_STRING (Is dev: $IS_DEV)"

      - name: Verify it is a dev release
        if: steps.version_check.outputs.is_dev_release == 'false'
        run: |
          echo "Error: The version is not a dev release."
          echo "Builds on the 'Development' branch must have a dev version (e.g., 1.2.3.dev1)."
          exit 1

      - name: Get commit information
        id: get_info
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Update version with commit hash
        if: steps.version_check.outputs.is_dev_release == 'true'
        id: set_full_version
        run: |
          BASE_VERSION="${{ steps.get_version.outputs.version }}"
          COMMIT_SHA="${{ steps.get_info.outputs.sha_short }}"
          FULL_VERSION="${BASE_VERSION}+${COMMIT_SHA}"
          echo "Setting full version to: $FULL_VERSION"
          sed -i -E "s/(__version__\s*=\s*[\"']).*([\"'])/\1${FULL_VERSION}\2/" quarchpy/_version.py
          echo "Verified file content:"
          cat quarchpy/_version.py
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT

      # --- THIS STEP IS UPDATED ---
      - name: Update MANIFEST.in for Dev Build
        # Only run this step if it's a dev release
        if: steps.version_check.outputs.is_dev_release == 'true'
        run: |
          echo "Original MANIFEST.in content:"
          cat MANIFEST.in
          
          echo "Appending QPS rule to MANIFEST.in..."
          # Use '>>' to APPEND to the file instead of overwriting
          echo "recursive-include quarchpy/connection_specific/QPS *" >> MANIFEST.in
          
          echo "New MANIFEST.in content:"
          cat MANIFEST.in

      - name: Build wheel package
        if: steps.version_check.outputs.is_dev_release == 'true'
        run: |
          # setup.py will now run, see 'include_package_data=True',
          # find the MODIFIED 'MANIFEST.in', and
          # correctly bundle the QPS files.
          python setup.py bdist_wheel --universal

      - name: Inspect Wheel Contents
        if: steps.version_check.outputs.is_dev_release == 'true'
        run: |
          echo "Inspecting contents of generated wheel file..."
          mkdir -p wheel_contents
          unzip -q dist/*.whl -d wheel_contents
          echo "Listing all files inside the wheel:"
          ls -lR wheel_contents
          # You should now see your QPS files under
          # wheel_contents/quarchpy/connection_specific/QPS/

      - name: Delete Previous Development Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete developmental --yes --cleanup-tag 2>/dev/null || echo "No previous developmental release to delete."

      - name: Force-update the 'developmental' Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f developmental
          git push -f origin refs/tags/developmental

      - name: Create Development Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Development Snapshot - ${{ steps.set_full_version.outputs.full_version }}"
          tag_name: "developmental"
          body: |
            **Latest Development build from the `Development` branch.**
            This is an unstable pre-release and is updated automatically on every push.

            **Commit:** [`${{ steps.get_info.outputs.sha_short }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            **Commit Message:**
            > ${{ github.event.head_commit.message }}
          prerelease: true
          files: |
            dist/*.whl