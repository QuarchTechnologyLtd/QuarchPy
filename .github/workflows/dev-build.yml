# .github/workflows/dev-build.yml
# This is the full name of the workflow. It's displayed on the GitHub Actions page.
name: QuarchPy Development Build and Release

# The 'on' keyword defines the events that trigger this workflow to run.
on:
  # 'push' triggers the workflow on every push event.
  push:
    # We only care about pushes to the 'Development' branch.
    branches:
      - 'Development'
      - '879-improve-quarchpy-snapshot'
  # 'workflow_dispatch' allows you to trigger this workflow manually from the GitHub UI.
  workflow_dispatch:

# A workflow run is made up of one or more 'jobs' that can run sequentially or in parallel.
jobs:
  # This is the unique ID of the job.
  build-and-release-dev:
    # The name of the job displayed on GitHub.
    name: Build and Create Development Release
    # Specifies the type of virtual machine to run the job on. 'ubuntu-latest' is a standard, fast choice.
    runs-on: ubuntu-latest

    # 'permissions' grants specific permissions to the GITHUB_TOKEN for this job.
    permissions:
      # 'contents: write' is required for actions that create or update releases and git tags.
      contents: write

    # 'steps' are the sequence of tasks that will be executed as part of the job.
    steps:
      # Each '-' is a new step. 'name' is the title shown in the logs.
      - name: Checkout repository
        # 'uses' specifies that this step will run a pre-built action.
        # 'actions/checkout@v5' is a standard action that downloads your repository's code
        # into the runner, so the subsequent steps can work with it.
        uses: actions/checkout@v5

      # --- THIS STEP IS UPDATED ---
      - name: Download and Unzip QPS Dependency
        # Use bash shell to support 'shopt' for a more robust mv command
        shell: bash
        env:
          # This secret is a Personal Access Token (PAT) with 'repo' scope
          # to access the private QuarchTechnologyLtd/QPS repository.
          GH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          echo "Creating target and temp directories..."
          mkdir -p connection_specific/QPS
          mkdir -p temp_qps_download
          mkdir -p temp_qps_unzip

          echo "Downloading QPS release asset (*.zip) from developmental tag..."
          # Use 'gh release download' to find the .zip asset generically.
          # The GH_TOKEN env var is automatically used by 'gh' for authentication.
          # We specify the repo, the tag ('developmental'), and a pattern ('*.zip').
          # This will download the first asset matching the pattern into the --dir.
          gh release download developmental \
            --repo QuarchTechnologyLtd/QPS \
            --pattern "*.zip" \
            --dir temp_qps_download
          
          echo "Unzipping files..."
          # Unzip the downloaded file (which is in temp_qps_download)
          # into a separate unzip directory.
          unzip -q temp_qps_download/*.zip -d temp_qps_unzip
          
          echo "Moving contents to target directory..."
          # This logic assumes the .zip file contains a single top-level folder
          # (e.g., 'QPS-v1.2.3'), just like the source code zip did.
          # 'shopt -s dotglob' makes '*' match hidden files/folders.
          # 'mv temp_qps_unzip/*/*' moves the *contents* of that unknown
          # top-level folder into our target 'connection_specific/QPS' directory.
          # This replicates the logic of your original 'mv .../QPS-developmental/*' command.
          shopt -s dotglob
          mv temp_qps_unzip/*/* connection_specific/QPS/
          
          echo "Cleaning up..."
          rm -r temp_qps_download
          rm -r temp_qps_unzip
          echo "QPS files are now in connection_specific/QPS"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache-dependency-path: '.github/workflows/requirements-dev.txt'
          cache: 'pip'

      - name: Clean pycache and .pyc files
        run: |
          find . -type d -name "__pycache__" -exec rm -r {} +
          find . -type f -name "*.pyc" -delete

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements-dev.txt
          pip install -r .github/workflows/requirements-build.txt

      - name: Test with pytest and coverage
        run: |
          coverage run -m pytest
          coverage report

      - name: Get project version from file
        id: get_version
        run: |
          VERSION_STRING=$(python -c "import re; f=open('quarchpy/_version.py').read(); print(re.search(r'__version__\s*=\s*[\'\"]([^\'\"]+)[\'\"]', f).group(1))")
          echo "version=$VERSION_STRING" >> $GITHUB_OUTPUT

      - name: Check if version is a dev release
        id: version_check
        run: |
          VERSION_STRING="${{ steps.get_version.outputs.version }}"
          IS_DEV=$(python -c "from packaging.version import Version; print(str(Version('$VERSION_STRING').is_devrelease).lower())")
          echo "is_dev_release=$IS_DEV" >> $GITHUB_OUTPUT
          echo "Version found: $VERSION_STRING (Is dev: $IS_DEV)"

      - name: Verify it is a dev release
        if: steps.version_check.outputs.is_dev_release == 'false'
        run: |
          echo "Error: The version is not a dev release."
          echo "Builds on the 'Development' branch must have a dev version (e.g., 1.2.3.dev1)."
          exit 1

      - name: Get commit information
        id: get_info
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Update version with commit hash
        if: steps.version_check.outputs.is_dev_release == 'true'
        id: set_full_version
        run: |
          BASE_VERSION="${{ steps.get_version.outputs.version }}"
          COMMIT_SHA="${{ steps.get_info.outputs.sha_short }}"
          
          # Create the new PEP 440-compliant version string
          FULL_VERSION="${BASE_VERSION}+${COMMIT_SHA}"
          
          echo "Base version: $BASE_VERSION"
          echo "Commit SHA: $COMMIT_SHA"
          echo "Setting full version to: $FULL_VERSION"
          
          # Use 'sed' to find and replace the version string in the file.
          sed -i -E "s/(__version__\s*=\s*[\"']).*([\"'])/\1${FULL_VERSION}\2/" quarchpy/_version.py
          
          echo "Verified file content:"
          cat quarchpy/_version.py
          
          # Output the new full version so the 'Create Release' step can use it
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT

      - name: Build wheel package
        if: steps.version_check.outputs.is_dev_release == 'true'
        run: |
          # This build command will now read the MODIFIED _version.py file
          python setup.py bdist_wheel --universal

      - name: Delete Previous Development Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete developmental --yes --cleanup-tag 2>/dev/null || echo "No previous developmental release to delete."

      - name: Force-update the 'developmental' Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f developmental
          git push -f origin refs/tags/developmental

      - name: Create Development Release
        uses: softprops/action-gh-release@v2
        with:
          # Use the new, full version from the 'set_full_version' step
          name: "Development Snapshot - ${{ steps.set_full_version.outputs.full_version }}"
          tag_name: "developmental"
          body: |
            **Latest Development build from the `Development` branch.**
            This is an unstable pre-release and is updated automatically on every push.

            **Commit:** [`${{ steps.get_info.outputs.sha_short }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            **Commit Message:**
            > ${{ github.event.head_commit.message }}
          prerelease: true
          files: |
            dist/*.whl