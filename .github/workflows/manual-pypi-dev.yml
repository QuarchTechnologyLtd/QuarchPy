name: Manual Dev Release to PyPI

on:
  workflow_dispatch:

jobs:
  release-pypi-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        # Added requests and packaging for the version check script
        pip install setuptools wheel twine build requests packaging

    # ---------------------------------------------------------
    # 1. Version Safety Checks
    # ---------------------------------------------------------
    - name: Verify Dev Version & Check PyPI
      id: check_version
      run: |
        python - <<EOF
        import sys
        import requests
        import re
        from packaging.version import parse

        # CONFIGURATION
        VERSION_FILE = 'quarchpy/_version.py'
        PACKAGE_NAME = 'quarchpy'  # Ensure this matches your PyPI package name

        # 1. Extract local version from file
        local_version = None
        try:
            with open(VERSION_FILE, 'r') as f:
                content = f.read()
                # Regex to find __version__ = "x.y.z"
                match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', content)
                if match:
                    local_version = match.group(1)
        except FileNotFoundError:
            print(f"::error::Could not find version file: {VERSION_FILE}")
            sys.exit(1)

        if not local_version:
            print(f"::error::Could not parse __version__ from {VERSION_FILE}")
            sys.exit(1)

        print(f"Detected local version: {local_version}")

        # 2. Validate it is a Dev Release (PEP 440)
        parsed_v = parse(local_version)
        if not parsed_v.is_devrelease:
            print(f"::error::Version '{local_version}' is NOT a dev release. Please update {VERSION_FILE} with a .dev suffix (e.g., 1.2.0.dev1).")
            sys.exit(1)
        
        print("Version format is valid (Dev release).")

        # 3. Check if exists on PyPI
        print(f"Checking PyPI for {PACKAGE_NAME}=={local_version}...")
        response = requests.get(f"https://pypi.org/pypi/{PACKAGE_NAME}/json")
        
        if response.status_code == 200:
            data = response.json()
            releases = data.get('releases', {}).keys()
            if local_version in releases:
                print(f"::error::Version '{local_version}' already exists on PyPI. Increment your dev version.")
                sys.exit(1)
            else:
                print(f"Success: Version '{local_version}' does not exist on PyPI yet.")
        elif response.status_code == 404:
             print("Package not found on PyPI (New package?). Proceeding.")
        else:
             print(f"::warning::Could not check PyPI (Status {response.status_code}). Proceeding with caution.")
        
        EOF

    # ---------------------------------------------------------
    # 2. Download and Extract QPS Binaries
    # ---------------------------------------------------------
    - name: Download QPS Binaries (Linux)
      env:
        GH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      run: |
        mkdir -p quarchpy/connection_specific/QPS

        echo "Downloading QPS for Linux..."
        gh release download \
          --repo QuarchTechnologyLtd/QPS \
          --pattern "qps-release-debian.zip" \
          --dir quarchpy/connection_specific/QPS

    - name: Extract QPS
      run: |
        cd quarchpy/connection_specific/QPS
        unzip -q "qps-release-debian.zip"
        mv qps/* .
        rmdir qps
        rm "qps-release-debian.zip"
        echo "QPS binaries extracted and flattened."

    # ---------------------------------------------------------
    # 3. Build and Publish
    # ---------------------------------------------------------
    - name: Build package
      run: |
        python -m build

    - name: Upload to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        echo "Uploading Dev Release to Production PyPI..."
        twine upload dist/*
