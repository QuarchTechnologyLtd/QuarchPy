name: Manual Dev Release to TestPyPI

on:
  workflow_dispatch:

jobs:
  release-testpypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # Often needed to download from GH packages

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine build

    - name: Download QPS Binaries (Linux)
      env:
        GH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      run: |
        # Create the destination directory
        mkdir -p quarchpy/connection_specific/QPS

        echo "Downloading QPS for Linux..."
        gh release download \
          --repo QuarchTechnologyLtd/QPS \
          --pattern "qps-release-debian.zip" \
          --dir quarchpy/connection_specific/QPS

    - name: Extract QPS
      run: |
        cd quarchpy/connection_specific/QPS
        
        # Unzip the downloaded file
        unzip -q "qps-release-debian.zip"
        
        # Remove the zip file so it doesn't get packaged
        rm "qps-release-debian.zip"
        
        echo "QPS binaries extracted to quarchpy/connection_specific/QPS"

    - name: Build package
      run: |
        # Creates source tarball and wheel in /dist
        python -m build

    - name: Upload to TestPyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
        TWINE_REPOSITORY: testpypi
      run: |
        echo "Uploading to Test PyPI..."
        twine upload dist/*