name: Python CI, Build, and Release

on:
  push:
    branches:
      - Py2-Release # Trigger build_and_release job on pushes to this branch
      # Add any other branches you want to run tests on, e.g., main
      # - main
  pull_request: # Run tests on pull requests to any branch

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10'] # You can expand this to test on multiple Python versions

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # This requirements file should contain dependencies for your project and tests
        # (e.g., pytest, coverage, flake8 if not installed separately)
        if [ -f .github/workflows/requirements.txt ]; then
          pip install -r .github/workflows/requirements.txt
        fi
        # Explicitly install testing tools if not in requirements.txt
        pip install pytest coverage flake8

    - name: Run tests with coverage
      run: |
        coverage run -m pytest
        coverage report
        coverage xml

#    - name: Upload coverage to Codecov
#      uses: codecov/codecov-action@v4
#      with:
#        token: ${{ secrets.CODECOV_TOKEN }}  # optional if public repo
#        files: ./coverage.xml
#        flags: unittests
#        name: codecov-coverage-report
#        fail_ci_if_error: true # Optional: fail CI if Codecov upload fails

#    - name: Lint with flake8
#      run: |
#        # stop the build if there are Python syntax errors or undefined names
#        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
#        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
#        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build_and_release:
    runs-on: ubuntu-latest
    # needs: test # Ensure tests pass before building and releasing (Commented out for now)
    # Only run this job on a push event to the Py2-Release branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/Py2-Release'

    permissions: # Required for actions/create-release and actions/upload-release-asset
      contents: write # To create releases and tags

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Extract version from _version.py
      id: get_version
      shell: bash
      run: |
        # This command assumes quarchpy/_version.py is at the root of your checkout
        # and __version__ is defined in it.
        # It adds the current directory to Python's path to allow the import.
        VERSION_STRING=$(python -c "import sys; sys.path.insert(0, '.'); from quarchpy._version import __version__; print(__version__)")
        
        if [ -z "$VERSION_STRING" ]; then
          echo "Error: Could not extract version string from quarchpy/_version.py"
          exit 1
        fi
        
        echo "Extracted version for release name: $VERSION_STRING"
        echo "version_string=$VERSION_STRING" >> "$GITHUB_OUTPUT"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel

    - name: Build wheel
      id: build_dist
      run: |
        # Ensure the dist directory is clean before building
        rm -rf dist/
        python setup.py bdist_wheel --universal
        # Find the built wheel file and set its path as an output
        echo "wheel_path=$(find dist -name '*.whl' -type f | head -n 1)" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is automatically provided by GitHub
      with:
        # The Git tag will remain unique per build run on the branch
        tag_name: Py2-Release-build-${{ github.run_number }}
        # The Release Name (title) will be the version string from your file
        release_name: QuarchPy-Py2 ${{ steps.get_version.outputs.version_string }}
        body: |
          Automated wheel build from branch Py2-Release.
          Version: ${{ steps.get_version.outputs.version_string }}
          Commit: ${{ github.sha }}
          Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        draft: false # Set to true if you want to manually review and publish the release
        prerelease: true # Marks this as a pre-release, suitable for automated builds

    - name: Upload Wheel Asset to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }} # URL for uploading assets from the create_release step
        asset_path: ${{ steps.build_dist.outputs.wheel_path }} # Path to the wheel file from the build_dist step
        # asset_name: # Optional: specify a name for the asset, defaults to the filename
        asset_content_type: application/zip # MIME type for .whl files (which are zip archives)