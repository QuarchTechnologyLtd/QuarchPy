name: Run Python tests and lint

on:
  push:
  pull_request:

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Clean pycache and .pyc files
    run: |
        find . -type d -name "__pycache__" -exec rm -r {} +
        find . -type f -name "*.pyc" -delete
    
    
    - name: Install dependencies
      shell: bash
      run: |
        pip install --upgrade pip
        pip install -r .github/workflows/requirements.txt
        pip install pytest coverage flake8

    - name: Run tests with coverage
      run: |
        coverage run -m pytest
        coverage report
        coverage xml

#    - name: Upload coverage to Codecov
#      uses: codecov/codecov-action@v4
#      with:
#        token: ${{ secrets.CODECOV_TOKEN }}  # optional if public repo
#        files: ./coverage.xml
#        flags: unittests
#        name: codecov-coverage-report


#    - name: Lint with flake8
#      run: |
#        flake8 quarchpy tests


    - name: Show ref
      run: echo "Ref is ${{ github.ref }}"

    - name: Install build tools
      if: github.ref == 'refs/heads/DevRelease' || github.ref == 'refs/heads/Release'
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine

    - name: Build wheel
      if: github.ref == 'refs/heads/DevRelease' || github.ref == 'refs/heads/Release'
      run: python setup.py bdist_wheel --universal

    - name: Upload to TestPyPI
      if: github.ref == 'refs/heads/DevRelease'
      run: |
        twine upload --repository testpypi dist/* -u __token__ -p ${{ secrets.TEST_PYPI_TOKEN }}
        echo "Upload to TestPyPI"

    - name: Upload to PyPI
      if: github.ref == 'refs/heads/Release'
      run: |
        twine upload dist/* -u __token__ -p ${{ secrets.PYPI_TOKEN }}
        echo "Upload to PyPI"

