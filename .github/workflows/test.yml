name: Run Python tests and lint

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-latest (24.04) no longer supports Python 3.7.
    # We must pin to 22.04 to run these older tests.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false  # If one version fails, let the others finish
      matrix:
        python-version: ['3.7', '3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r .github/workflows/requirements-dev.txt
        pip install pytest coverage flake8 setuptools wheel

#    - name: Lint with flake8
#      run: |
#        # stop the build if there are Python syntax errors or undefined names
#        flake8 quarchpy tests --count --select=E9,F63,F7,F82 --show-source --statistics
#        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
#        flake8 quarchpy tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests with coverage
      run: |
        coverage run -m pytest
        coverage report
        # coverage xml # Uncomment if using Codecov later

    - name: Verify Build (Dry Run)
      # Checks if setup.py is valid and packages can be built on this specific python version
      run: python setup.py bdist_wheel --universal

  release:
    needs: test
    # Only run if tests pass AND we are pushing to specific branches
    if: github.event_name == 'push' && (github.ref == 'refs/heads/DevRelease' || github.ref == 'refs/heads/Release')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python (for build)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Use a stable version for the official build

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine

    - name: Build wheel
      run: python setup.py bdist_wheel --universal

    - name: Upload to TestPyPI
      if: github.ref == 'refs/heads/DevRelease'
      run: |
        twine upload --repository testpypi dist/* -u __token__ -p ${{ secrets.TEST_PYPI_TOKEN }}
        echo "Uploaded to TestPyPI"

    - name: Upload to PyPI
      if: github.ref == 'refs/heads/Release'
      run: |
        twine upload dist/* -u __token__ -p ${{ secrets.PYPI_TOKEN }}
        echo "Uploaded to PyPI"