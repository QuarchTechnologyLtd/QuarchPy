name: Python CI, Build, and Release

on:
  push:
    branches:
      - Py2-Release # Trigger build_and_release job on pushes to this branch
      # Add any other branches you want to run tests on, e.g., main
      # - main
  pull_request: # Run tests on pull requests to any branch

jobs:
  test:
    runs-on: ubuntu-22.04 # Good choice for Python 2.7
    # strategy: matrix: python-version: ['2.7'] # Matrix not needed if only testing 2.7 manually

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 2.7 manually
      run: |
        sudo apt-get update -y
        sudo apt-get install -y python2 curl
        python2 --version
        # Install pip for Python 2.7
        curl https://bootstrap.pypa.io/pip/2.7/get-pip.py --output get-pip.py
        sudo python2 get-pip.py
        pip2 --version
        # Ensure python2 and pip2 are found
        which python2
        which pip2

    - name: Install dependencies
      shell: bash
      run: |
        # Use pip2 for Python 2.7
        pip2 install --upgrade pip # Upgrades pip2 itself
        if [ -f .github/workflows/requirements.txt ]; then
          pip2 install -r .github/workflows/requirements.txt
        fi
        # Install testing tools and Py2 backports
        pip2 install pytest coverage flake8 future-fstrings enum34

    - name: Run tests with coverage
      run: |
        # Use python2 -m to invoke modules with Python 2.7
        python2 -m coverage run -m pytest
        python2 -m coverage report
        python2 -m coverage xml

#    - name: Upload coverage to Codecov
#      # ... (ensure this step is compatible if used)

#    - name: Lint with flake8
#      run: |
#        # flake8 installed with pip2 should be invokable directly
#        # or use python2 -m flake8
#        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
#        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build_and_release:
    runs-on: ubuntu-22.04
    # needs: test # Recommended: Uncomment to run after tests pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/Py2-Release'

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 2.7 manually and install future-fstrings
      run: |
        sudo apt-get update -y
        sudo apt-get install -y python2 curl
        python2 --version
        # Install pip for Python 2.7
        curl https://bootstrap.pypa.io/pip/2.7/get-pip.py --output get-pip.py
        sudo python2 get-pip.py
        pip2 --version
        # Install future-fstrings + enum34 as it's needed for _version.py import
        pip2 install future-fstrings
        pip2 install enum34

    - name: Extract version from _version.py
      id: get_version
      shell: bash
      run: |
        # Use python2 for the extraction script
        VERSION_STRING=$(python2 -c "import sys; sys.path.insert(0, '.'); from quarchpy._version import __version__; print(__version__)")
        
        if [ -z "$VERSION_STRING" ]; then
          echo "Error: Could not extract version string from quarchpy/_version.py"
          exit 1
        fi
        
        echo "Extracted version for release name: $VERSION_STRING"
        echo "version_string=$VERSION_STRING" >> "$GITHUB_OUTPUT"

    - name: Install build tools
      run: |
        # Use pip2
        pip2 install setuptools wheel

    - name: Build wheel
      id: build_dist
      run: |
        rm -rf dist/
        # Use python2
        python2 setup.py bdist_wheel --universal
        echo "wheel_path=$(find dist -name '*.whl' -type f | head -n 1)" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: Py2-Release-build-${{ github.run_number }}
        release_name: QuarchPy-Py2 ${{ steps.get_version.outputs.version_string }}
        body: |
          Automated wheel build from branch Py2-Release.
          Version: ${{ steps.get_version.outputs.version_string }}
          Commit: ${{ github.sha }}
          Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        draft: false
        prerelease: true

    - name: Upload Wheel Asset to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.build_dist.outputs.wheel_path }}
        asset_content_type: application/zip